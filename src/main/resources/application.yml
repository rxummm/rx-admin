server:
  port: 8088
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 2048
  tomcat:
    max-swallow-size: 100MB

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB
  application:
    name: rx-admin
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  cache:
    type: caffeine
  datasource:
    # 主数据源：rx_admin（系统管理）
    primary:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://localhost:3306/rx_admin?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:root}
    # 第二数据源：rxusysadmin（四大名著）
    second:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://localhost:3306/rxusysadmin?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:root}

  # Flyway 数据库迁移（主数据源）
  flyway:
    enabled: true
    locations: classpath:db/migration/primary
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Baseline
    clean-disabled: true

mybatis-plus:
  type-aliases-package: com.rx.admin.modules.**.entity
  configuration:
    map-underscore-to-camel-case: true
    # 日志：生产环境使用 SLF4J，不直接输出 SQL 到控制台
    # 本地开发环境在 application-local.yml 中覆盖为 StdOutImpl
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sa-Token 配置（内存模式，不依赖Redis）
sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: 1800
  is-concurrent: false
  is-share: false
  token-style: uuid
  is-log: false

# Knife4j 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

# 应用自定义配置
app:
  # API 版本控制配置
  api:
    # API 前缀，默认 /api
    prefix: /api
    # 默认版本号，默认 v1
    default-version: v1
    # 是否启用版本控制，false 则忽略版本号
    enabled: true
  cors:
    # 允许的跨域来源，多个逗号分隔，生产环境请指定具体域名，开发环境 Vite 代理不受此影响
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}
  cache:
    # 系统配置缓存过期时间（秒），默认 10 分钟
    config-ttl-seconds: 600
    # 菜单树缓存过期时间（秒），默认 1 小时
    menu-ttl-seconds: 3600
    # 字典数据缓存过期时间（秒），默认 30 分钟
    dict-ttl-seconds: 1800
    # 日历事件缓存过期时间（秒），默认 2 分钟
    calendar-ttl-seconds: 120
    # 仪表盘统计缓存刷新间隔（毫秒），默认 30 秒
    dashboard-refresh-ms: 30000
  menu:
    # 不可申请的顶级菜单ID（系统管理1、系统工具24、内容管理30、系统监控36）
    excluded-top-ids: 1,24,30,36
    # 排除的权限申请菜单ID
    excluded-permission-menu-id: 300
  slow-query:
    # 慢查询阈值（毫秒）
    threshold-ms: 2000
  # 验证码配置
  captcha:
    # 验证码过期时间（毫秒），默认 5 分钟
    expire-ms: 300000
    # 过期验证码清理间隔（毫秒），默认 60 秒
    cleanup-interval-ms: 60000
  # 防重放配置
  replay:
    # 时间窗口（毫秒），超过此偏差拒绝请求，默认 5 分钟
    time-window-ms: 300000
    # nonce 缓存最大条目数
    max-nonce-cache: 10000
  # 技术博客抓取配置
  techblog:
    # 批量抓取页间请求延迟（毫秒），避免被反爬
    request-delay-ms: 1000
    # 列表页抓取超时（毫秒）
    page-timeout-ms: 15000
    # 单篇文章详情抓取超时（毫秒）
    article-timeout-ms: 30000
  # 音频转写配置
  audio:
    # Whisper 可执行文件路径
    whisper-path: ${AUDIO_WHISPER_PATH:D:\vueprojects\ffmpeg\bin\whisper.exe}
    # 模型文件存储路径
    model-path: ${AUDIO_MODEL_PATH:D:\whisper\models}
    # 默认使用的模型（tiny/base/small/medium/large-v3）
    #default-model: ${AUDIO_DEFAULT_MODEL:small}
    default-model: ${AUDIO_DEFAULT_MODEL:tiny}
    # 默认语言（zh/en/ja/ko 等）
    default-language: ${AUDIO_DEFAULT_LANGUAGE:zh}
    # Whisper CPU 线程数（默认 4，适量减少可降低 CPU 占用）
    threads: ${AUDIO_THREADS:4}
    # 临时文件目录
    temp-dir: ${AUDIO_TEMP_DIR:D:\temp\audio}
    # 最大文件大小（MB）
    max-file-size-mb: ${AUDIO_MAX_FILE_SIZE_MB:100}
    # 是否启用音频转写功能
    enabled: ${AUDIO_ENABLED:true}
    # WhisperX 说话人分离配置（可选高级模式，需要 Python whisperx-api 服务）
    whisperx-enabled: ${WHISPERX_ENABLED:true}
    whisperx-api-url: ${WHISPERX_API_URL:http://localhost:8880}
    whisperx-api-key: ${WHISPERX_API_KEY:}
  # OCR 文档识别配置
  ocr:
    enabled: ${OCR_ENABLED:true}
    tessdata-path: ${OCR_TESSDATA_PATH:D:\tesseract-ocr\tessdata}
    default-language: ${OCR_DEFAULT_LANGUAGE:chi_sim+eng}
    temp-dir: ${OCR_TEMP_DIR:D:\temp\ocr}
    max-file-size-mb: ${OCR_MAX_FILE_SIZE_MB:50}
  # 邮件发送配置（SMTP）
  mail:
    # 发件人地址（与认证用户一致）
    from: ${MAIL_FROM:xubingzhen83@163.com}
    # SMTP 服务器
    host: ${MAIL_HOST:smtp.163.com}
    # SMTP 端口（465=SSL, 587=STARTTLS）
    port: ${MAIL_PORT:465}
    # 认证用户名（通常与发件人地址相同）
    username: ${MAIL_USERNAME:}
    # 认证密码（163邮箱为授权码，非登录密码）
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          ssl:
            enable: ${MAIL_SMTP_SSL:true}
  # IP 黑白名单配置
  ip-filter:
    enabled: false              # 默认关闭，生产环境按需开启
    mode: blacklist             # blacklist（黑名单模式）或 whitelist（白名单模式）
    ips:                        # IP 列表，逗号分隔，如: 192.168.1.100,10.0.0.5

# AS400 连接配置（密码通过环境变量注入，不硬编码在配置文件中）
as400:
  host: ${AS400_HOST:pub400.com}
  username: ${AS400_USERNAME:}
  password: ${AS400_PASSWORD:}
  # 默认库列表
  default-libraries: A7RXUZZ1,A7RXUZZ2,A7RXUZZB

# 代码生成器配置
gen:
  table-schema: rx_admin

# 常用工具配置
common-tools:
  upload:
    dir: D:/vueprojects/RX/ui/public/shareddocs

# 音乐播放器配置
music:
  folder: C:/Users/admin/Downloads/music

# 视频播放器配置
video:
  folder: C:/Users/admin/Downloads/video

# Actuator 监控
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# 日志（由 logback-spring.xml 管理，此处仅保留日志级别配置）
logging:
  level:
    "[com.rx.admin]": INFO
    "[org.springframework]": INFO
    "[org.mybatis]": INFO